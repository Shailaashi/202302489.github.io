<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaila Ulayan</title>
    
    <style>
        :root {
            --c-deep: #D94496;
            --c-mid: #F47DBB;
            --c-light: #FF99CC;
            --c-soft: #FFB6D5;
            --c-bg: #FFF5F9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--c-bg);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .bg-glow-1 {
            position: absolute;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, var(--c-light) 0%, #f1bcd200 70%);
            top: -80px;
            left: -80px;
            z-index: 0;
            opacity: 0.6;
        }

        .bg-glow-2 {
            position: absolute;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, var(--c-mid) 0%, #f17bb800 70%);
            bottom: -100px;
            right: -100px;
            z-index: 0;
            opacity: 0.45;
        }

        .card-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 360px;
            background: #FFFFFF;
            border-radius: 30px;
            padding: 40px 28px;
            text-align: center;
            box-shadow: 0 20px 45px #d9449626,
                        0 0 0 2px var(--c-soft);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-container:hover {
            transform: translateY(-6px);
            box-shadow: 0 28px 55px #d9449638,
                        0 0 0 3px var(--c-mid);
        }

        .avatar-ring {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, var(--c-deep) 0%, var(--c-mid) 50%, var(--c-soft) 100%);
            box-shadow: 0 10px 25px #d9449659;
            margin-bottom: 22px;
            transition: transform 0.3s ease;
        }

        .card-container:hover .avatar-ring {
            transform: scale(1.05);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background-color: var(--c-soft);
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2D1525;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .profile-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--c-deep);
            background: linear-gradient(90deg, var(--c-deep), var(--c-mid));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .profile-bio {
            font-size: 0.92rem;
            color: #664A5A;
            line-height: 1.5;
            margin-bottom: 28px;
            max-width: 290px;
        }

        .github-btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 24px;
            background: linear-gradient(135deg, var(--c-deep) 0%, var(--c-mid) 100%);
            color: #FFFFFF;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 18px;
            box-shadow: 0 10px 22px #d9449659;
            transition: all 0.3s ease;
        }

        .github-btn:hover {
            background: linear-gradient(135deg, var(--c-mid) 0%, var(--c-deep) 100%);
            box-shadow: 0 14px 28px #d9449680;
            transform: translateY(-2px);
        }

        .github-btn i {
            font-size: 1.25rem;
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <main class="card-container">
        <!-- 150px Avatar -->
        <div class="avatar-ring">
            <img class="avatar-img" 
                 src="https://mystickermania.com/cdn/stickers/anime/mairimashita-kalego-transformation-512x512.png" 
                 alt="Profile Avatar"
                 onerror="this.src='https://placehold.co/300x300/FFB6D5/D94496?text=Shaila'">
        </div>

        <h1 class="profile-name">Shaila S. Ulayan</h1>
        <p class="profile-title">BSIT 4-5</p>
        <p class="profile-title">ONLINE ACTIVITY #1</p>
        <p class="profile-bio">Hi! This is my Activity 1 in ITEC111. Click the Button to view my GitHub! </p>

        <a href="https://github.com/Shailaashi/202302489.github.io" target="_blank" rel="noopener noreferrer" class="github-btn">
            <i class="fa-brands fa-github"></i>
            <span>View GitHub Profile</span>
        </a>
    </main>

</body>
</html>
